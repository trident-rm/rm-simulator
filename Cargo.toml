[workspace]
resolver = "3"
members = [
    "crates/sim-engine",
    "crates/sim-render",
    "crates/sim-physics",
    "crates/rm-sim-assets",
    "crates/rm-sim-control",
    "crates/rm-sim-gameplay",
    "crates/rm-sim-world",
    "crates/rm-sim-physics",
    "crates/rm-sim-render",
    "crates/rm-sim-presentation",
    "crates/rm-sim-server",
    "crates/rm-sim-app",
    "crates/rm-sim-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
thiserror = "2"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1"
serde_json = "1"
sha2 = "0.10"
glam = "0.33.12"
# Wire-compression candidate: ZSTD with a trained checkpoint dictionary.
# `legacy` and `arrays` are unused; `zdict_builder` trains the embedded dictionary.
zstd = { version = "0.13", default-features = false, features = ["zdict_builder"] }
# Expand Bevy 0.20's `3d` / `3d_bevy_render` / `3d_api` bundles so KTX2
# decoding uses our existing native Zstd backend. The bundles force zstd_rust
# and ruzstd 0.8, affected by RUSTSEC-2026-0344; simply adding zstd_c is additive.
# Keep the rest of the 3d feature set when updating Bevy.
bevy = { version = "0.20.0", default-features = false, features = [
    "default_app", "default_platform", "scene", "picking",
    "common_api", "bevy_light", "bevy_mikktspace", "ktx2",
    "morph_animation", "morph", "smaa_luts", "tonemapping_luts", "zstd_c",
    "bevy_render", "bevy_core_pipeline", "bevy_gizmos_render",
    "bevy_anti_alias", "bevy_gltf", "bevy_pbr", "bevy_post_process",
    "gltf_animation", "ui", "default_font",
] }

# Bevy is unusably slow unoptimized; keep the app itself debuggable.
[profile.dev.package."*"]
opt-level = 3
# Keep workspace debug information, but omit third-party dependency symbols.
debug = 0

[profile.dev]
opt-level = 1
