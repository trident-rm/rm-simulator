[default]
# Commit IDs in provenance must never be rewritten as ordinary words.
extend-ignore-re = ['\b[0-9a-f]{7,40}\b']

[default.extend-identifiers]
# Existing domain terms and coordinate indices, not spelling errors.
iy = "iy"
PNGs = "PNGs"

[default.extend-words]
# RoboMaster team name; retain its official spelling in source credits.
ENTERPRIZE = "ENTERPRIZE"
