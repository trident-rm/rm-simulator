[package]
name = "rm-sim-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "rm-sim-server"
path = "src/main.rs"
required-features = ["native-host"]

[features]
default = ["native-host"]
# Native sockets, host workers, filesystem construction and operator services.
native-host = ["dep:game-networking-sockets", "dep:if-addrs"]

[dependencies]
rm-sim-control = { version = "0.1.0", path = "../rm-sim-control" }
rm-sim-assets = { version = "0.1.0", path = "../rm-sim-assets" }
rm-sim-physics = { version = "0.1.0", path = "../rm-sim-physics" }
glam.workspace = true
rm-sim-world = { version = "0.1.0", path = "../rm-sim-world" }
anyhow.workspace = true
clap.workspace = true
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true
game-networking-sockets = { version = "0.3.0", optional = true }
zstd.workspace = true
web-time = "1.1"
if-addrs = { version = "0.15", optional = true }

[dev-dependencies]
criterion = { version = "0.8", default-features = false }

[[bench]]
name = "net_codec"
harness = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
zstd = { workspace = true, features = ["wasm"] }
