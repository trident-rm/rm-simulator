[package]
name = "rm-sim-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "rm-simulator"
path = "src/main.rs"

[features]
steam = ["dep:steamworks"]
# Opt-in MQTT referee link for testing custom clients (`--referee-link`).
referee-link = ["dep:rumqttd", "dep:prost"]

[build-dependencies]
sha2.workspace = true

[dependencies]
rm-sim-assets = { version = "0.1.0", path = "../rm-sim-assets" }
rm-sim-render = { version = "0.1.0", path = "../rm-sim-render" }
anyhow.workspace = true
bevy.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { workspace = true, features = ["bevy_feathers", "bevy_ui_widgets", "serialize"] }
glam.workspace = true
rm-sim-world = { version = "0.1.0", path = "../rm-sim-world" }
rm-sim-presentation = { version = "0.1.0", path = "../rm-sim-presentation" }
rm-sim-server = { version = "0.1.0", path = "../rm-sim-server" }
bevy_flair = "0.9.0"
clap.workspace = true
serde = { workspace = true, features = ["std"] }
sha2.workspace = true
steamworks = { version = "=0.13.1", optional = true }
prost = { version = "0.14", optional = true }
rumqttd = { version = "0.20", default-features = false, optional = true }

[dev-dependencies]
rm-sim-control = { version = "0.1.0", path = "../rm-sim-control", features = ["test-support"] }
rm-sim-physics = { version = "0.1.0", path = "../rm-sim-physics" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { workspace = true, features = ["webgpu"] }
zstd = { workspace = true, features = ["wasm"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
rm-sim-server = { version = "0.1.0", path = "../rm-sim-server", default-features = false }
rm-sim-world = { version = "0.1.0", path = "../rm-sim-world" }
rm-sim-presentation = { version = "0.1.0", path = "../rm-sim-presentation" }
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Response", "Location", "UrlSearchParams", "Headers", "WebSocket", "BinaryType", "MessageEvent", "Event"] }
