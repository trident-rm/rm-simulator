<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RoboMaster simulator</title>
  <style>
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#212630; color:#eef0f5; font:15px system-ui,sans-serif; }
    canvas { display:block; width:100%; height:100%; outline:none; }
    #status:not([hidden]) { position:absolute; z-index:1; top:16px; left:16px; padding:16px; background:#141820; color:#ffb1a4; }
  </style>
</head>
<body>
  <p id="status" role="status" hidden></p>
  <canvas id="sim" tabindex="0" aria-label="RoboMaster simulator"></canvas>
  <script type="module">
    const status = document.getElementById('status');
    const fail = error => {
      status.hidden = false;
      status.dataset.state = 'error';
      status.textContent = `Cannot start simulator: ${error.message || error}`;
    };
    window.addEventListener('error', event => fail(event.error || event.message));
    window.addEventListener('unhandledrejection', event => fail(event.reason));
    try {
      if (!navigator.gpu) throw new Error('This simulator requires WebGPU.');
      const {default: init} = await import('./pkg/rm_simulator.js');
      await init();
    } catch (error) { fail(error); }
  </script>
</body>
</html>
