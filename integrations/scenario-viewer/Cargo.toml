[workspace]
resolver = "3"

[package]
name = "rm-scenario-viewer"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
bevy = { version = "=0.20.0", default-features = false, features = [
    "default_app", "default_platform", "scene", "picking",
    "common_api", "bevy_light", "bevy_mikktspace", "ktx2",
    "morph_animation", "morph", "smaa_luts", "tonemapping_luts", "zstd_c",
    "bevy_render", "bevy_core_pipeline", "bevy_gizmos_render",
    "bevy_anti_alias", "bevy_gltf", "bevy_pbr", "bevy_post_process",
    "gltf_animation", "ui", "default_font",
] }
clap = { version = "=4.6.0", features = ["derive"] }
rm-sim-engine = { version = "0.1.0", path = "../../crates/rm-sim-engine" }
rm-sim-physics = { version = "0.1.0", path = "../../crates/rm-sim-physics" }
rm-sim-render = { version = "0.1.0", path = "../../crates/rm-sim-render", default-features = false }

[profile.dev]
opt-level = 1
debug = 0

[profile.dev.package."*"]
opt-level = 3
debug = 0

[lints.rust]
unsafe_code = "forbid"
