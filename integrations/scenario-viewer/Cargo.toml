[workspace]
resolver = "3"

[package]
name = "rm-scenario-viewer"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
default-run = "rm-scenario-viewer"

[features]
default = []
rxui-viewer = ["dep:rxui", "dep:png", "dep:serde", "dep:serde_json", "dep:nalgebra"]

[[bin]]
name = "rm-rxui-viewer"
path = "src/rxui_viewer.rs"
required-features = ["rxui-viewer"]

[dependencies]
bevy = { version = "=0.20.0", default-features = false, features = [
    "default_app", "default_platform", "scene", "picking",
    "common_api", "bevy_light", "bevy_mikktspace", "ktx2",
    "morph_animation", "morph", "smaa_luts", "tonemapping_luts", "zstd_c",
    "bevy_render", "bevy_core_pipeline", "bevy_gizmos_render",
    "bevy_anti_alias", "bevy_gltf", "bevy_pbr", "bevy_post_process",
    "gltf_animation", "ui", "default_font",
] }
clap = { version = "=4.6.0", features = ["derive"] }
sim-engine = { version = "0.1.0", path = "../../crates/sim-engine" }
sim-physics = { version = "0.1.0", path = "../../crates/sim-physics" }
sim-render = { version = "0.1.0", path = "../../crates/sim-render" }

rxui = { version = "=0.2.0-dev.0", git = "https://github.com/hxyulin/rxui", rev = "0fcb9ea12b552d3ee887f60c2135586001650030", default-features = false, features = ["native"], optional = true }
png = { version = "0.18", optional = true }
serde = { version = "1", features = ["derive", "rc"], optional = true }
serde_json = { version = "1", optional = true }
nalgebra = { version = "=0.35.0", optional = true }

[profile.dev]
opt-level = 1
debug = 0

[profile.dev.package."*"]
opt-level = 3
debug = 0

[lints.rust]
unsafe_code = "forbid"
