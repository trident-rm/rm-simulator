[workspace]
resolver = "3"

[package]
name = "rm-scenario-inspector"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = []
native = ["dep:rxui"]

[dependencies]
anyhow = "1"
serde_json = "1"
png = "0.18"
rm-sim-assets = { version = "0.1.0", path = "../../crates/rm-sim-assets" }
rm-sim-physics = { version = "0.1.0", path = "../../crates/rm-sim-physics" }
rxui = { version = "=0.2.0-dev.0", git = "https://github.com/hxyulin/rxui", rev = "656bf5ed460ed9604b65fa9538354fb6c746a7d4", default-features = false, features = ["native"], optional = true }

[profile.dev]
debug = 0

[lints.rust]
unsafe_code = "forbid"
