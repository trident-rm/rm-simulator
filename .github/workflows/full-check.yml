name: Full validation
on:
  workflow_dispatch:
    inputs:
      force:
        description: Ignore a previous successful validation of this commit
        type: boolean
        default: false
  workflow_call:
    inputs:
      force:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  receipt:
    name: Look up validated commit
    runs-on: ubuntu-24.04
    outputs:
      reused: ${{ steps.lookup.outputs.reused }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Find successful validation for this SHA
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_VALIDATION: ${{ inputs.force }}
        run: python3 scripts/validated-commit.py
  repository:
    # Advisory data changes independently of the source SHA; rerun cheap checks.
    needs: receipt
    uses: ./.github/workflows/ci.yaml
  native:
    needs: receipt
    if: needs.receipt.outputs.reused != 'true'
    uses: ./.github/workflows/package.yml
    with:
      version: '0.0.0'
      package: false
      validate: true
  portable:
    name: Host-free client and Wasm compile
    needs: receipt
    if: needs.receipt.outputs.reused != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: portable-client
      - name: Install Wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Check and test the host-free client
        run: |
          cargo clippy -p rm-sim-server --lib --test portable_client --no-default-features --locked -- -D warnings
          cargo test -p rm-sim-server --lib --test portable_client --no-default-features --locked
          cargo test -p rm-sim-server --doc --no-default-features --locked
      - name: Compile for browsers
        run: |
          cargo check -p rm-sim-server --lib --no-default-features --target wasm32-unknown-unknown --locked
          cargo clippy -p rm-sim-app --bin rm-simulator --target wasm32-unknown-unknown --locked -- -D warnings
  result:
    name: Full validation passed
    if: always()
    needs: [receipt, repository, native, portable]
    runs-on: ubuntu-24.04
    steps:
      - name: Require reused success or all current checks
        env:
          RECEIPT_RESULT: ${{ needs.receipt.result }}
          REUSED: ${{ needs.receipt.outputs.reused }}
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          PORTABLE_RESULT: ${{ needs.portable.result }}
        run: |
          test "$RECEIPT_RESULT" = success
          test "$REPOSITORY_RESULT" = success
          if [ "$REUSED" != true ]; then
            test "$NATIVE_RESULT" = success
            test "$PORTABLE_RESULT" = success
          fi
